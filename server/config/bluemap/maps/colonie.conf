# Carte BlueMap du monde de la Colonie. À la création du vrai monde : changer « world » (= level-name) puis « bluemap purge <id> ».
world: "test-andesite"
dimension: "minecraft:overworld"
name: "La Colonie"
sorting: 0
sky-color: "#7dabff"
void-color: "#000000"
sky-light: 1
