############
## Server Config Profile "default"
## La Colonie : imposé à tous les joueurs (décision du 2026-10-05).
## Pas de mode grotte hors du Nether (il révèle grottes et intérieurs), pas de radar ni de suivi des joueurs,
## pas de chunks à slimes. Les points de mort restent : ils mènent à la tombe.

profile_name = Default
minimap_cave_mode_allowed = true
minimap_cave_mode_allowed_dimensions = [minecraft:the_nether]
display_radar = false
tracked_players_on_minimap = false
tracked_players_in_world = false
minimap_slime_chunks = false
deathpoints = true
