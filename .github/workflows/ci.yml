name: Tests du mod
# À la main seulement : le compte GitHub de KOLRAX est bloqué (facturation), les sessions cloud testent elles-mêmes.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mod-npc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilation et tests JUnit
        run: ./gradlew build --no-daemon
      - name: Tests en jeu (GameTests)
        run: ./gradlew runGameTestServer --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colonie_pnj
          path: |
            mod-npc/build/libs/*.jar
            mod-npc/build/reports/tests/
          if-no-files-found: ignore
