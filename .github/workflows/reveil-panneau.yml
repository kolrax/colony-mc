# Un projet Supabase gratuit se met en pause après 7 jours sans visite : on le visite chaque jour.
name: Réveil du panneau modpack
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  visite:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -o /dev/null -w "HTTP %{http_code}\n" https://wegefcdewecwjvmhaaxb.supabase.co/functions/v1/modpack
